    example_model: "claude-opus-4-7"
  - pattern: "claude-sonnet-*"
    group_name: "vip"
    example_model: "claude-sonnet-4-6"
  - pattern: "claude-haiku-*"
    group_name: "vip"
    example_model: "claude-haiku-4-5"
  - pattern: "claude-fable-*"
    group_name: "vip"
    example_model: "claude-fable-5"
