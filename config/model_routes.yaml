    group_name: "openai-default"
    example_model: "gpt-5.6-high"
  - pattern: "o1-*"
    group_name: "openai-default"
    example_model: "o1-preview"
  - pattern: "o3-*"
    group_name: "openai-default"
    example_model: "o3-mini"
